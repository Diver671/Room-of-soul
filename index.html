<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Комната Души — Версия 2.0</title>
    <style>
        :root {
            --bg-color: #0d0f14;
            --card-bg: #161923;
            --accent-amber: #f5a623;
            --accent-amber-hover: #ffb833;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #2a2f42;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.75rem;
            color: var(--accent-amber);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .panel h2 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: var(--accent-amber);
        }

        .symbols-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .symbol-card {
            background: #1e2230;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .symbol-card:hover {
            border-color: var(--accent-amber);
            transform: translateY(-2px);
        }

        .symbol-card.selected {
            background: rgba(245, 166, 35, 0.15);
            border-color: var(--accent-amber);
        }

        .canvas-area {
            background: #11141d;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            min-height: 250px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 12px;
            padding: 16px;
            position: relative;
        }

        .canvas-placeholder {
            color: var(--text-muted);
            margin: auto;
            text-align: center;
            font-size: 0.95rem;
            pointer-events: none;
        }

        .placed-item {
            background: #1e2230;
            border: 1px solid var(--accent-amber);
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.3s ease;
        }

        .placed-item button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
        }

        .placed-item button:hover {
            color: #ff5252;
        }

        .btn {
            background-color: var(--accent-amber);
            color: #0d0f14;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .btn:hover {
            background-color: var(--accent-amber-hover);
        }

        .result-box {
            background: #161923;
            border: 1px solid var(--accent-amber);
            border-radius: 12px;
            padding: 20px;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .result-box h3 {
            color: var(--accent-amber);
            margin-bottom: 10px;
        }

        .result-box p {
            line-height: 1.5;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Комната Души</h1>
        <p>Интерактивная метафорическая расстановка (Версия 2.0)</p>
    </header>

    <div class="container">
        <!-- Панель выбора символов -->
        <div class="panel">
            <h2>1. Выберите элементы для расстановки</h2>
            <div class="symbols-grid" id="symbolsContainer">
                <!-- Генерируются скриптом -->
            </div>
        </div>

        <!-- Холст расстановки -->
        <div class="panel">
            <h2>2. Ваше пространство</h2>
            <div class="canvas-area" id="canvasArea">
                <div class="canvas-placeholder" id="placeholder">Выберите элементы выше, чтобы разместить их в Комнате Души</div>
            </div>
        </div>

        <!-- Кнопка анализа -->
        <button class="btn" id="analyzeBtn" style="display: none;">Получить инсайт и ритуал-якорь</button>

        <!-- Блок результата -->
        <div class="result-box" id="resultBox">
            <h3>Инсайт расстановки</h3>
            <p id="insightText"></p>
            <h3 style="margin-top: 16px;">Физический ритуал-якорь</h3>
            <p id="ritualText"></p>
        </div>
    </div>

    <script>
        const symbols = [
            { id: 1, name: "🕯️ Очаг / Свеча", category: "Тепло и ресурс" },
            { id: 2, name: "🪞 Старинное зеркало", category: "Отражение сути" },
            { id: 3, name: "🪑 Удобное кресло", category: "Опора и отдых" },
            { id: 4, name: "🚪 Приоткрытая дверь", category: "Путь и изменения" },
            { id: 5, name: "🪴 Живое растение", category: "Рост и развитие" },
            { id: 6, name: "⏳ Песочные часы", category: "Время и процессы" }
        ];

        let selectedSymbols = [];

        const symbolsContainer = document.getElementById('symbolsContainer');
        const canvasArea = document.getElementById('canvasArea');
        const placeholder = document.getElementById('placeholder');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const resultBox = document.getElementById('resultBox');
        const insightText = document.getElementById('insightText');
        const ritualText = document.getElementById('ritualText');

        function renderSymbols() {
            symbolsContainer.innerHTML = '';
            symbols.forEach(sym => {
                const card = document.createElement('div');
                card.className = `symbol-card ${selectedSymbols.includes(sym.id) ? 'selected' : ''}`;
                card.innerHTML = `<strong>${sym.name}</strong><br><small style="color:var(--text-muted);">${sym.category}</small>`;
                card.onclick = () => toggleSymbol(sym.id);
                symbolsContainer.appendChild(card);
            });
        }

        function toggleSymbol(id) {
            const index = selectedSymbols.indexOf(id);
            if (index > -1) {
                selectedSymbols.splice(index, 1);
            } else {
                selectedSymbols.push(id);
            }
            renderCanvas();
            renderSymbols();
        }

        function renderCanvas() {
            canvasArea.innerHTML = '';
            if (selectedSymbols.length === 0) {
                canvasArea.appendChild(placeholder);
                analyzeBtn.style.display = 'none';
                resultBox.style.display = 'none';
                return;
            }

            selectedSymbols.forEach(id => {
                const sym = symbols.find(s => s.id === id);
                const item = document.createElement('div');
                item.className = 'placed-item';
                item.innerHTML = `<span>${sym.name}</span> <button onclick="event.stopPropagation(); toggleSymbol(${sym.id})">×</button>`;
                canvasArea.appendChild(item);
            });

            analyzeBtn.style.display = 'block';
        }

        analyzeBtn.onclick = () => {
            resultBox.style.display = 'block';
            insightText.textContent = "Ваша текущая расстановка отражает внутренний баланс между потребностью в безопасности и готовностью к внутреннему обновлению. Выбранные объекты показывают фокус внимания на текущих внутренних опорах.";
            ritualText.textContent = "Зажгите настоящую свечу или уделите 3 минуты тишине в удобном кресле, сделав три глубоких вдоха. Почувствуйте телесную плотность и заземление в моменте «здесь и сейчас».";
            resultBox.scrollIntoView({ behavior: 'smooth' });
        };

        renderSymbols();
    </script>
</body>
</html>
