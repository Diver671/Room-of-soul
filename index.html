<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Комната Души — Версия 2.0</title>
    <style>
        :root {
            --bg-deep: #080a0f;
            --surface-velvet: #131722;
            --surface-card: #1c2230;
            --amber-glow: #f5a623;
            --amber-hover: #ffb833;
            --text-main: #f0f4f8;
            --text-muted: #8c9bae;
            --border-velvet: #2a344a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        header {
            text-align: center;
            margin-bottom: 4px;
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--amber-glow);
            margin-bottom: 2px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(245, 166, 35, 0.3);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .panel {
            background-color: var(--surface-velvet);
            border: 1px solid var(--border-velvet);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        }

        .panel h3 {
            font-size: 0.95rem;
            color: var(--amber-glow);
            margin-bottom: 8px;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        @media (max-width: 480px) {
            .items-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .item-card {
            background: var(--surface-card);
            border: 1px solid var(--border-velvet);
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            font-size: 0.8rem;
            user-select: none;
        }

        .item-card:hover {
            border-color: var(--amber-glow);
            background: #242d42;
        }

        .room-wrapper {
            background-color: var(--surface-velvet);
            border: 1px solid var(--border-velvet);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Адаптивная круглая комната */
        .circle-room {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, #10141f 0%, #080a0f 85%);
            border: 2px solid var(--amber-glow);
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.8), 0 0 15px rgba(245, 166, 35, 0.15);
            position: relative;
            margin: 10px auto;
            touch-action: none;
        }

        .room-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background-color: rgba(245, 166, 35, 0.3);
            border-radius: 50%;
        }

        .placed-element {
            position: absolute;
            background: var(--surface-card);
            border: 1px solid var(--amber-glow);
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            cursor: grab;
            user-select: none;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }

        .placed-element:active {
            cursor: grabbing;
        }

        .hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 6px;
        }

        .btn {
            background-color: var(--amber-glow);
            color: #080a0f;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--amber-hover);
        }

        .result-box {
            margin-top: 10px;
            background: var(--surface-card);
            border: 1px solid var(--amber-glow);
            border-radius: 10px;
            padding: 12px;
            display: none;
        }

        .result-box h4 {
            color: var(--amber-glow);
            margin-bottom: 4px;
            font-size: 0.9rem;
        }

        .result-box p {
            font-size: 0.8rem;
            line-height: 1.35;
            color: var(--text-main);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Комната Души</h1>
            <p>Версия 2.0 • Расстановка</p>
        </header>

        <!-- Сетка выбора символов -->
        <div class="panel">
            <h3>Элементы</h3>
            <div class="items-grid" id="itemsList"></div>
        </div>

        <!-- Круглая комната -->
        <div class="room-wrapper">
            <h3 style="margin-bottom: 2px;">Пространство</h3>
            <div class="circle-room" id="circleRoom">
                <div class="room-center"></div>
            </div>
            <div class="hint">Тапните по элементу для добавления. Перетаскивайте внутри круга. Долгое нажатие (или клик правой кнопкой) удаляет элемент.</div>
        </div>

        <!-- Кнопка и инсайт -->
        <div class="panel">
            <button class="btn" id="analyzeBtn">Проявить инсайт расстановки</button>
            <div class="result-box" id="resultBox">
                <h4>Инсайт пространства</h4>
                <p id="insightText"></p>
                <h4>Телесный якорь-ритуал</h4>
                <p id="ritualText"></p>
            </div>
        </div>
    </div>

    <script>
        const availableItems = [
            { id: 'fire', name: '🕯️ Очаг' },
            { id: 'mirror', name: '🪞 Зеркало' },
            { id: 'chair', name: '🪑 Кресло' },
            { id: 'door', name: '🚪 Дверь' },
            { id: 'plant', name: '🪴 Растение' },
            { id: 'clock', name: '⏳ Часы' }
        ];

        let placedElements = [];
        let activeDrag = null;

        const itemsList = document.getElementById('itemsList');
        const circleRoom = document.getElementById('circleRoom');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const resultBox = document.getElementById('resultBox');
        const insightText = document.getElementById('insightText');
        const ritualText = document.getElementById('ritualText');

        const ROOM_RADIUS = 140; // Радиус для контейнера 280x280
        const CENTER = 140;

        function renderSidebar() {
            itemsList.innerHTML = '';
            availableItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item-card';
                div.textContent = item.name;
                div.onclick = () => addElementToRoom(item);
                itemsList.appendChild(div);
            });
        }

        function addElementToRoom(item) {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * 60;
            const x = CENTER + Math.cos(angle) * dist;
            const y = CENTER + Math.sin(angle) * dist;

            const elementData = {
                id: Date.now() + Math.random(),
                name: item.name,
                x: x,
                y: y
            };

            placedElements.push(elementData);
            renderRoom();
        }

        function renderRoom() {
            const existing = circleRoom.querySelectorAll('.placed-element');
            existing.forEach(el => el.remove());

            placedElements.forEach(el => {
                const div = document.createElement('div');
                div.className = 'placed-element';
                div.textContent = el.name;
                div.style.left = `${el.x}px`;
                div.style.top = `${el.y}px`;

                const startDrag = (clientX, clientY) => {
                    activeDrag = el;
                };

                div.onmousedown = (e) => { e.stopPropagation(); startDrag(e.clientX, e.clientY); };
                div.ontouchstart = (e) => { e.stopPropagation(); startDrag(e.touches[0].clientX, e.touches[0].clientY); };

                div.oncontextmenu = (e) => {
                    e.preventDefault();
                    removeElement(el.id);
                };

                // Удаление по долгому клику для телефонов
                let touchTimer;
                div.ontouchstart = (e) => {
                    startDrag(e.touches[0].clientX, e.touches[0].clientY);
                    touchTimer = setTimeout(() => {
                        removeElement(el.id);
                    }, 800);
                };
                div.ontouchend = () => clearTimeout(touchTimer);

                circleRoom.appendChild(div);
            });
        }

        function removeElement(id) {
            placedElements = placedElements.filter(item => item.id !== id);
            renderRoom();
        }

        const moveHandler = (clientX, clientY) => {
            if (!activeDrag) return;
            const rect = circleRoom.getBoundingClientRect();
            let x = clientX - rect.left;
            let y = clientY - rect.top;

            const dx = x - CENTER;
            const dy = y - CENTER;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > ROOM_RADIUS - 20) {
                x = CENTER + (dx / dist) * (ROOM_RADIUS - 20);
                y = CENTER + (dy / dist) * (ROOM_RADIUS - 20);
            }

            activeDrag.x = x;
            activeDrag.y = y;
            renderRoom();
        };

        window.onmousemove = (e) => moveHandler(e.clientX, e.clientY);
        window.ontouchmove = (e) => { if (e.touches.length > 0) moveHandler(e.touches[0].clientX, e.touches[0].clientY); };

        window.onmouseup = () => { activeDrag = null; };
        window.ontouchend = () => { activeDrag = null; };

        analyzeBtn.onclick = () => {
            if (placedElements.length === 0) {
                alert("Разместите хотя бы один элемент в комнате.");
                return;
            }

            const names = placedElements.map(el => el.name).join(', ');
            insightText.textContent = `Ваше поле (${names}) отражает актуальное внутреннее состояние. Взаимное расположение объектов показывает баланс между опорами и фокусом внимания.`;
            ritualText.textContent = `Сделайте три глубоких вдоха. Почувствуйте заземление и стабильность в теле.`;
            
            resultBox.style.display = 'block';
            resultBox.scrollIntoView({ behavior: 'smooth' });
        };

        renderSidebar();
    </script>
</body>
</html>
