<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Комната Души — Версия 2.0 (Синхронизированная)</title>
    <style>
        :root {
            --bg-velvet: #0f0f13;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --card-bg: rgba(25, 25, 35, 0.9);
            --text-main: #f0f0f5;
            --text-muted: #9ba1a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            touch-action: none; /* Предотвращаем скролл страницы на мобилках при перетаскивании */
        }

        body {
            background-color: var(--bg-velvet);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100vh;
            max-height: 850px;
        }

        .header {
            text-align: center;
            margin-bottom: 4px;
        }

        .header h1 {
            color: var(--gold);
            font-size: 22px;
            font-weight: 600;
        }

        .header p {
            color: var(--text-muted);
            font-size: 12px;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .panel-title {
            font-size: 13px;
            color: var(--gold-light);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .elements-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .element-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 8px;
            color: var(--text-main);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .element-btn:hover, .element-btn:active {
            background: rgba(212, 175, 55, 0.2);
            border-color: var(--gold);
        }

        .room-space {
            flex-grow: 1;
            background: radial-gradient(circle at center, #1a1a24 0%, #0a0a0f 100%);
            border: 2px dashed rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            width: 100%;
            min-height: 340px;
        }

        .room-center-mark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background-color: var(--gold);
            border-radius: 50%;
            opacity: 0.4;
        }

        .placed-item {
            position: absolute;
            background: rgba(25, 25, 35, 0.95);
            border: 1px solid var(--gold);
            color: var(--gold-light);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            cursor: grab;
            user-select: none;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .placed-item:active {
            cursor: grabbing;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Комната Души</h1>
            <p>Версия 2.0 • Расширенное поле расстановок</p>
        </div>

        <div class="panel">
            <div class="panel-title">Элементы и фигуры</div>
            <div class="elements-grid">
                <button class="element-btn" onclick="addElement('🕯 Очаг')">🕯 Очаг</button>
                <button class="element-btn" onclick="addElement('🪞 Зеркало')">🪞 Зеркало</button>
                <button class="element-btn" onclick="addElement('🪑 Кресло')">🪑 Кресло</button>
                <button class="element-btn" onclick="addElement('🚪 Дверь')">🚪 Дверь</button>
                <button class="element-btn" onclick="addElement('🌿 Дерево')">🌿 Дерево</button>
                <button class="element-btn" onclick="addElement('⏳ Часы')">⏳ Часы</button>
            </div>
        </div>

        <div class="panel room-space" id="roomSpace">
            <div class="room-center-mark"></div>
        </div>

        <div class="footer">
            @SoulRoomBot • Синхронизировано для Web & Telegram
        </div>
    </div>

    <script>
        function addElement(name) {
            const room = document.getElementById('roomSpace');
            const item = document.createElement('div');
            item.className = 'placed-item';
            item.innerText = name;
            
            const rect = room.getBoundingClientRect();
            const x = rect.width / 2 + (Math.random() * 40 - 20);
            const y = rect.height / 2 + (Math.random() * 40 - 20);
            
            item.style.left = x + 'px';
            item.style.top = y + 'px';

            let activeItem = null;
            let startX = 0, startY = 0;

            function onPointerDown(e) {
                activeItem = item;
                const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
                const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
                
                const itemRect = item.getBoundingClientRect();
                startX = clientX - itemRect.left - itemRect.width / 2;
                startY = clientY - itemRect.top - itemRect.height / 2;
                
                document.addEventListener('pointermove', onPointerMove);
                document.addEventListener('pointerup', onPointerUp);
                e.preventDefault();
            }

            function onPointerMove(e) {
                if (!activeItem) return;
                const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
                const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
                const roomRect = room.getBoundingClientRect();

                let newX = clientX - roomRect.left - startX;
                let newY = clientY - roomRect.top - startY;

                // Ограничиваем перемещение внутри контейнера комнаты
                newX = Math.max(30, Math.min(roomRect.width - 30, newX));
                newY = Math.max(30, Math.min(roomRect.height - 30, newY));

                activeItem.style.left = newX + 'px';
                activeItem.style.top = newY + 'px';
            }

            function onPointerUp() {
                activeItem = null;
                document.removeEventListener('pointermove', onPointerMove);
                document.removeEventListener('pointerup', onPointerUp);
            }

            item.addEventListener('pointerdown', onPointerDown);
            room.appendChild(item);
        }
    </script>
</body>
</html>
